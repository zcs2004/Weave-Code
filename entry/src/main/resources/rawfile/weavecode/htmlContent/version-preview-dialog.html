<div class="about-dialog modal">
    <div class="modal-header">
        <h1 class="dialog-title">{{Strings.CMD_VERSION_PREVIEW}}</h1>
    </div>
    <div class="modal-body about-summary">
        <img class="about-icon" src="{{ABOUT_ICON}}" alt="">
        <h2>{{APP_NAME_ABOUT_BOX}}</h2>
        <p class="about-version" style="white-space: pre-line;">{{Strings.VERSION_PREVIEW_MESSAGE}}</p>
    </div>
    <div class="modal-footer">
        <button class="dialog-button btn primary" data-button-id="ok">{{Strings.CLOSE}}</button>
    </div>
</div>
