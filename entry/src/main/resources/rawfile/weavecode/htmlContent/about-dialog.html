<div class="about-dialog modal">
    <div class="modal-header">
        <h1 class="dialog-title">{{Strings.ABOUT}}</h1>
    </div>
    <div class="modal-body about-summary">
        <img class="about-icon" src="{{ABOUT_ICON}}" alt="">
        <h2>{{APP_NAME_ABOUT_BOX}}</h2>
        <p class="about-version">{{Strings.ABOUT_VERSION_LABEL}} {{APP_VERSION}}</p>
        <div class="about-details">
            <p><span class="about-label">{{Strings.ABOUT_CONTACT}}:</span> zcs2004@126.com</p>
            <p><span class="about-label">GitHub:</span> <a class="about-external-link" href="https://github.com/zcs2004/Weave-Code">https://github.com/zcs2004/Weave-Code</a></p>
        </div>
        <div class="about-copyright" aria-label="Copyright">
            <p>Weave Code {{Strings.ABOUT_COPYRIGHT_WEAVE_CODE}}</p>
        </div>
    </div>
    <div class="modal-footer">
        <button class="dialog-button btn primary" data-button-id="ok">{{Strings.CLOSE}}</button>
    </div>
</div>
