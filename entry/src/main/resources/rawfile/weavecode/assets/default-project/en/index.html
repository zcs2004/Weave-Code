<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030a24">
  <meta name="description" content="织码 WeaveCode，以代码为线，编织数字世界。">
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="stylesheet" href="styless.css">
  <title>织码 WeaveCode — 编织数字世界</title>
</head>
<body>
  <main class="landing" id="home">
    <div class="stars" aria-hidden="true"></div>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <button class="language-switch" id="language-switch" type="button"
      aria-label="Switch language" aria-pressed="false">EN / 中文</button>

    <section class="identity" aria-labelledby="brand-title">
      <div class="brand-mark">
        <img src="images/icon.png" alt="织码交织几何标志">
      </div>

      <h1 id="brand-title">织码 WeaveCode</h1>
      <p class="brand-english">WEAVE THE DIGITAL WORLD</p>
      <p class="tagline" id="tagline">以代码为线，<span>编织数字世界。</span></p>
      <span class="gold-thread" aria-hidden="true"></span>

      <div class="personas" >
        <article class="persona">
          <div class="portrait">
            <img src="images/yy.png" >
          </div>
          <p data-zh="专注 · 沉淀" data-en="FOCUS · REFLECTION">专注 · 沉淀</p>
        </article>

        <article class="persona">
          <div class="portrait">
            <img src="images/cs.png" >
          </div>
          <p data-zh="沟通 · 连接" data-en="PEOPLE · CONNECTION">沟通 · 连接</p>
        </article>

        <article class="persona">
          <div class="portrait">
            <img src="images/xc.png" >
          </div>
          <p data-zh="技术 · 创造" data-en="TECH · CREATION">技术 · 创造</p>
        </article>
      </div>
    </section>

    <footer class="landing-footer">
      <span>ONE THREAD</span>
      <i aria-hidden="true"></i>
      <span>INFINITE POSSIBILITIES</span>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
